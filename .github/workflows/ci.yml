name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Host, web UI and package
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (UI, then the debug host)
        run: pnpm build
      - run: app/host/.build/debug/sim-agentation version
      - name: Host unit tests
        run: swift test --package-path app/host
      - name: Command line answers without starting a server
        # perl's alarm stands in for timeout, which the runner may not have; a
        # run it kills exits 142, so every check below wants an exact status.
        # A free port, so a regression that serves fails fast instead of hanging.
        env:
          SIM_AGENTATION_PORT: "38499"
        run: |
          b=app/host/.build/debug/sim-agentation
          version=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' app/host/Sources/sim-agentation/Config.swift)
          out=$(mktemp) err=$(mktemp)
          # check STATUS STREAM ARGS...: the run exits STATUS and leaves the other stream empty.
          check() {
            want=$1 stream=$2; shift 2
            rc=0; perl -e 'alarm 5; exec @ARGV' "$b" "$@" >"$out" 2>"$err" || rc=$?
            if [ "$stream" = stdout ]; then other=$err; else other=$out; fi
            if [ "$rc" != "$want" ] || [ -s "$other" ]; then
              echo "::error::sim-agentation $*: exit $rc (want exit $want, with output only on $stream)"
              cat "$out" "$err"; exit 1
            fi
          }
          for a in help --help -h "serve --help" "--port 38499 -h"; do
            check 0 stdout $a; grep -q '^Usage:' "$out" || { echo "::error::sim-agentation $a: no usage"; exit 1; }
          done
          for a in version --version -v "serve -v"; do
            check 0 stdout $a; [ "$(cat "$out")" = "$version" ] || { echo "::error::sim-agentation $a: not $version"; exit 1; }
          done
          for a in bogus --bogus -x -help --Help "serve bogus" "mcp bogus" --port; do
            check 1 stderr $a; grep -q '^Usage:' "$err" || { echo "::error::sim-agentation $a: no usage on stderr"; exit 1; }
          done
      - name: Package (release build)
        run: app/scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sim-agentation-macos-arm64
          path: dist/*.tar.gz

  sdk:
    name: SDK on every platform, and the demo app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build the package for macOS
        run: swift build
      - name: Type-check each platform, Debug and Release
        # swiftc against each SDK: unlike xcodebuild, it doesn't need the
        # platform's simulator runtime installed.
        working-directory: Sources/SimAgentationPlus
        run: |
          for pair in iphonesimulator:arm64-apple-ios17.0-simulator \
                      macosx:arm64-apple-macos14.0 \
                      appletvsimulator:arm64-apple-tvos17.0-simulator \
                      watchsimulator:arm64-apple-watchos10.0-simulator \
                      xrsimulator:arm64-apple-xros1.0-simulator; do
            for debug in -DDEBUG ""; do
              echo "${pair#*:} ${debug:-release}"
              xcrun -sdk "${pair%%:*}" swiftc -swift-version 6 -module-name SimAgentationPlus \
                -parse-as-library -target "${pair#*:}" $debug -typecheck ./*.swift
            done
          done
      - name: Build for Mac Catalyst
        run: xcodebuild build -scheme SimAgentationPlus -destination 'generic/platform=macOS,variant=Mac Catalyst' -quiet
      - name: Build the demo app
        working-directory: assets/examples/DemoApp
        run: xcodebuild build -workspace DemoApp.xcworkspace -scheme DemoApp -destination 'generic/platform=iOS Simulator' -quiet

  plugins:
    name: Plugin manifests and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Manifests match the version and the launcher
        run: python3 app/scripts/plugins.py --check
      - run: sh -n app/scripts/mcp-launch.sh
      - name: Manifests parse
        run: |
          for f in .claude-plugin/*.json .codex-plugin/*.json .cursor-plugin/*.json .agents/plugins/*.json skills/*/evals/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done
      - name: Skills have front matter
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' && grep -q '^name:' "$f" && grep -q '^description:' "$f" && echo "ok $f"
          done
      - run: python3 -m py_compile skills/sim-agentation-sdk/scripts/add_package.py
